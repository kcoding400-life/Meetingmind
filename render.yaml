# MeetingMind — Render Deployment Configuration
# Deploy the entire stack from this file:
#   1. Connect your GitHub repo to Render
#   2. Render detects render.yaml and creates all services
#   3. Set the secret environment variables in the Render dashboard
#
# Services:
#   meetingmind-api      — FastAPI backend (web service)
#   meetingmind-frontend — Streamlit frontend (web service)
#   meetingmind-redis    — Redis cache (managed Redis)


services:

  # FastAPI Backend
  - type: web
    name: meetingmind-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon

    envVars:
      # ── Set these in the Render dashboard (not here — never commit secrets) ──
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # ── Wired automatically from the Redis service below ──
      - key: REDIS_URL
        fromService:
          name: meetingmind-redis
          type: redis
          property: connectionString

      # ── App config (safe to commit) ──
      - key: SUPABASE_BUCKET
        value: meeting-audio
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-preview-05-20
      - key: MAX_UPLOAD_SIZE_MB
        value: "100"
      - key: QA_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: DEBUG
        value: "false"

    healthCheckPath: /health

  # Streamlit Frontend
  - type: web
    name: meetingmind-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    plan: free
    region: oregon

    envVars:
      # Points at the API service — Render resolves internal URLs automatically
      - key: API_BASE_URL
        fromService:
          name: meetingmind-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
        value: https://meetingmind-api.onrender.com/api/v1

  # Redis
  - type: redis
    name: meetingmind-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []   # only allow internal Render network access
